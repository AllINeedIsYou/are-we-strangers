<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Are we strangers? — телефон</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: radial-gradient(ellipse at center, #251018 0, #111013 42%, #070708 85%);
      }
      .phone {
        position: relative;
        width: min(414px, 100%);
        height: min(884px, calc(100dvh - 32px));
        padding: 9px;
        border: 1px solid #756d72;
        border-radius: 52px;
        background: linear-gradient(140deg, #554b52, #161316 35%, #393138 85%, #62565e);
        box-shadow: inset 0 0 0 2px #171317, 0 24px 75px #0009;
      }
      .phone::before, .phone::after {
        content: '';
        position: absolute;
        width: 3px;
        border-radius: 3px;
        background: #51464e;
      }
      .phone::before { top: 134px; left: -4px; height: 60px; box-shadow: 0 76px #51464e; }
      .phone::after { top: 180px; right: -4px; height: 86px; }
      .screen {
        height: 100%;
        display: grid;
        grid-template-rows: 35px minmax(0, 1fr) 17px;
        border-radius: 43px;
        overflow: hidden;
        background: #080809;
        box-shadow: 0 0 0 1px #000;
      }
      .camera { position: relative; }
      .camera::before {
        content: '';
        position: absolute;
        width: 106px;
        height: 24px;
        top: 7px;
        left: 50%;
        transform: translateX(-50%);
        background: #000;
        border-radius: 20px;
      }
      .camera::after {
        content: '';
        position: absolute;
        top: 14px;
        left: calc(50% + 32px);
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: radial-gradient(circle, #283045, #080b12 65%);
      }
      iframe { display: block; border: 0; width: 100%; height: 100%; min-height: 0; }
      .home { display: grid; place-items: center; }
      .home::before { content: ''; width: 112px; height: 4px; border-radius: 4px; background: #d8d0d7; }
    </style>
  </head>
  <body>
    <main class="phone" aria-label="Предпросмотр в телефоне">
      <div class="screen">
        <div class="camera" aria-hidden="true"></div>
        <iframe src="/" title="Are we strangers? — мобильная версия"></iframe>
        <div class="home" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
